<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AGNUS — Article Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#F4F2EE;--surface:#FFF;--surface-2:#EDEAE4;--border:#DDD9D0;--ink:#18202A;--ink-2:#4A5261;--ink-3:#8E96A2;--navy:#17263C;--navy-2:#0F1A28;--gold:#9A7633;--gold-bg:rgba(154,118,51,.09);--gold-border:rgba(154,118,51,.25);--pass:#0F6E3A;--pass-bg:rgba(15,110,58,.09);--pass-border:rgba(15,110,58,.22);--blue:#1A56A0;--mono:'IBM Plex Mono',monospace;--sans:Manrope,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column}
.rail{background:var(--navy-2);height:52px;display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;z-index:100}
.rail-brand{font-weight:800;font-size:14px;color:#fff}
.rail-sep{width:1px;height:20px;background:rgba(255,255,255,.12)}
.rail-crumb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.rail-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.rb{font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);background:transparent;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:background .15s}
.rb:hover{background:rgba(255,255,255,.08)}
.rb-gold{border-color:rgba(154,118,51,.4);color:var(--gold);background:rgba(154,118,51,.08)}
.btn{font-family:var(--sans);font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-2)}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:12px;align-items:center;flex-shrink:0}
.board{flex:1;overflow-x:auto;padding:20px 24px;display:flex;gap:16px;align-items:flex-start}
.col{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:0}
.col-head{padding:12px 14px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between}
.ch-title{font-size:12.5px;font-weight:800;letter-spacing:-.01em}
.ch-count{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px}
.col-body{background:var(--surface-2);border-radius:0 0 10px 10px;min-height:200px;padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:box-shadow .12s}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}
.card-id{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-3);margin-bottom:5px}
.card-title{font-size:13px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:6px}
.card-meta{font-size:11.5px;color:var(--ink-3)}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.ct{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--border)}
.ct-gold{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border)}
.ct-pass{background:var(--pass-bg);color:var(--pass);border-color:var(--pass-border)}
.add-card{width:100%;padding:9px;border:1.5px dashed var(--border);border-radius:8px;background:transparent;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;transition:all .12s}
.add-card:hover{border-color:var(--gold);color:var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(15,26,40,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.4)}
.modal-head{background:linear-gradient(135deg,var(--navy),#1E3560);padding:24px 28px;border-radius:18px 18px 0 0}
.mh-id{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(154,118,51,.8);margin-bottom:6px}
.mh-title{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff}
.modal-body{padding:22px 28px;display:grid;gap:16px}
.mf{display:flex;flex-direction:column;gap:5px}
.mf label{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.mf input,.mf select,.mf textarea{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:13.5px;outline:none;background:var(--bg);color:var(--ink)}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--navy-2)}
.modal-foot{padding:16px 28px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:space-between}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.stage-btn{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-3);cursor:pointer;transition:all .12s}
.stage-btn:hover,.stage-btn.active{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}
</style>
</head>
<body>
<header class="rail">
  <span class="rail-brand">AGNUS Editorial</span>
  <span class="rail-sep"></span>
  <span class="rail-crumb">E11 · Article Pipeline</span>
  <div class="rail-right">
    <a href="AGNUS - E12 - Story Builder.html" class="rb">Story Builder</a>
    <a href="AGNUS - Editorial Platform.html" class="rb">← Hub</a>
    <button class="btn btn-navy" onclick="openNewCard()">+ New article</button>
  </div>
</header>

<div class="toolbar">
  <span style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)">Pipeline · <span id="totalCount">0</span> articles tracked</span>
</div>

<div class="board" id="board"></div>
<div class="modal-bg" id="modalBg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="agnus-research-data.js"></script>
<script>
var STAGES = [
  {id:'briefing', label:'Briefing', color:'#1A56A0', bg:'rgba(26,86,160,.08)'},
  {id:'drafting', label:'Drafting', color:'#9A7633', bg:'rgba(154,118,51,.08)'},
  {id:'review',   label:'Your review', color:'#7B4EA0', bg:'rgba(123,78,160,.08)'},
  {id:'ready',    label:'Ready to publish', color:'#0F6E3A', bg:'rgba(15,110,58,.08)'},
  {id:'published',label:'Published', color:'#18202A', bg:'rgba(24,32,42,.05)'}
];

var pipeline = [];
try{ pipeline = JSON.parse(localStorage.getItem('agnus_pipeline')||'[]'); }catch(e){}
// Seed from published articles if empty
if(!pipeline.length && window.ARTICLES){
  window.ARTICLES.slice(0,8).forEach(function(a,i){
    pipeline.push({id:a.article_id,title:a.title,stage:'published',pillar:a.pillar,jurisdiction:'',created:a.published,notes:''});
  });
}
var editing = null;

function save(){ localStorage.setItem('agnus_pipeline', JSON.stringify(pipeline)); }

function render(){
  document.getElementById('totalCount').textContent = pipeline.length;
  var board = document.getElementById('board');
  board.innerHTML = STAGES.map(function(s){
    var cards = pipeline.filter(function(c){ return c.stage===s.id; });
    return '<div class="col">'+
      '<div class="col-head" style="background:'+s.bg+'">'+
        '<span class="ch-title" style="color:'+s.color+'">'+s.label+'</span>'+
        '<span class="ch-count" style="background:'+s.color+'22;color:'+s.color+'">'+cards.length+'</span>'+
      '</div>'+
      '<div class="col-body">'+
        cards.map(function(c){ return cardHtml(c); }).join('')+
        '<button class="add-card" onclick="openNewCard(\''+s.id+'\')">+ Add here</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function cardHtml(c){
  return '<div class="card" onclick="openCard(\''+c.id+'\')">'+
    '<div class="card-id">'+c.id+'</div>'+
    '<div class="card-title">'+c.title+'</div>'+
    (c.jurisdiction?'<div class="card-meta">'+c.jurisdiction+'</div>':'')+
    '<div class="card-tags">'+
      (c.pillar?'<span class="ct ct-gold">'+c.pillar+'</span>':'')+
      (c.stage==='published'?'<span class="ct ct-pass">Live</span>':'')+
    '</div>'+
  '</div>';
}

window.openNewCard = function(stage){
  editing = {id:'AR-NEW-'+Date.now(),title:'',stage:stage||'briefing',pillar:'EU AI Act',jurisdiction:'',notes:'',created:new Date().toISOString()};
  showModal(true);
};

window.openCard = function(id){
  editing = pipeline.find(function(c){ return c.id===id; });
  if(!editing) return;
  showModal(false);
};

function showModal(isNew){
  var c = editing;
  document.getElementById('modal').innerHTML =
    '<div class="modal-head"><div class="mh-id">'+(isNew?'New article':c.id)+'</div><div class="mh-title">'+(c.title||'Untitled')+'</div></div>'+
    '<div class="modal-body">'+
      '<div class="mf"><label>Title</label><input id="mc-title" value="'+c.title+'" placeholder="Article working title"/></div>'+
      '<div class="mf"><label>Pillar</label><select id="mc-pillar"><option>EU AI Act</option><option>Country</option><option>Standards</option><option>Data</option><option>Security</option><option>AI Governance</option><option>AI Agents</option><option>Academy</option></select></div>'+
      '<div class="mf"><label>Jurisdiction</label><input id="mc-jur" value="'+c.jurisdiction+'" placeholder="EU, UK, South Korea…"/></div>'+
      '<div class="mf"><label>Stage</label><div class="stages">'+STAGES.map(function(s){ return '<button class="stage-btn'+(c.stage===s.id?' active':'')+'" onclick="setStage(\''+s.id+'\')">'+s.label+'</button>'; }).join('')+'</div></div>'+
      '<div class="mf"><label>Notes</label><textarea id="mc-notes" rows="3" placeholder="Source IDs, flags, context…">'+c.notes+'</textarea></div>'+
    '</div>'+
    '<div class="modal-foot">'+
      (isNew
        ? '<button class="btn" style="background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)" onclick="closeModal()">Cancel</button><button class="btn btn-navy" onclick="createCard()">Create</button>'
        : '<button class="btn" style="color:#B03020;background:transparent;border:1px solid #B03020" onclick="deleteCard()">Delete</button><div style="display:flex;gap:8px"><button class="btn" style="background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)" onclick="closeModal()">Cancel</button><button class="btn btn-navy" onclick="saveCard()">Save</button></div>'
      )+
    '</div>';
  // Set select
  setTimeout(function(){ var ps=document.getElementById('mc-pillar'); if(ps){for(var i=0;i<ps.options.length;i++){if(ps.options[i].value===c.pillar){ps.selectedIndex=i;break;}}} },0);
  document.getElementById('modalBg').style.display='flex';
}

window.setStage = function(s){ editing.stage=s; showModal(!pipeline.find(function(c){return c.id===editing.id;})); };
window.closeModal = function(){ document.getElementById('modalBg').style.display='none'; editing=null; };
window.saveCard = function(){
  editing.title=document.getElementById('mc-title').value;
  editing.pillar=document.getElementById('mc-pillar').value;
  editing.jurisdiction=document.getElementById('mc-jur').value;
  editing.notes=document.getElementById('mc-notes').value;
  save(); closeModal(); render();
};
window.createCard = function(){
  editing.title=document.getElementById('mc-title').value||'Untitled';
  editing.pillar=document.getElementById('mc-pillar').value;
  editing.jurisdiction=document.getElementById('mc-jur').value;
  editing.notes=document.getElementById('mc-notes').value;
  pipeline.unshift(editing);
  save(); closeModal(); render();
};
window.deleteCard = function(){
  if(!confirm('Remove from pipeline?')) return;
  pipeline=pipeline.filter(function(c){return c.id!==editing.id;});
  save(); closeModal(); render();
};

render();
</script>
</body>
</html>
