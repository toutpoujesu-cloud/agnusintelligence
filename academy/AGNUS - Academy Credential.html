<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AGNUS Academy — Competency Credential</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F4F2EE;--surface:#FFFFFF;--surface-2:#EEF0F5;--border:#D8DAE2;
  --ink:#0F1623;--ink-2:#3D4558;--ink-3:#7A8099;
  --navy:#0A1628;--navy-2:#112040;--navy-3:#1A3260;
  --blue:#1A56A0;--blue-2:#1668C4;
  --pass:#0F6E3A;--pass-bg:rgba(15,110,58,.09);--pass-border:rgba(15,110,58,.22);
  --gold:#9A6F20;--gold-light:#B59048;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.rail{background:var(--navy);height:56px;display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:200}
.rail-brand{font-weight:800;font-size:15px;color:#fff}
.rail-sep{width:1px;height:22px;background:rgba(255,255,255,.12);flex-shrink:0}
.rail-crumb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.rail-right{margin-left:auto;display:flex;gap:10px}
.rail-btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.16);color:#fff;background:rgba(255,255,255,.07);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:background .2s}
.rail-btn:hover{background:rgba(255,255,255,.14)}
.wrap{max-width:720px;margin:0 auto;padding:52px 24px 100px}
.verify-bar{background:var(--pass-bg);border:1px solid var(--pass-border);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;margin-bottom:28px}
.vb-icon{width:34px;height:34px;border-radius:50%;background:var(--pass);display:grid;place-items:center;flex-shrink:0}
.vb-title{font-size:13.5px;font-weight:700;color:var(--pass)}
.vb-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.cert{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:28px;box-shadow:0 24px 60px -24px rgba(10,22,40,.15)}
@media print{.cert{box-shadow:none;border:1.5px solid var(--border)}}
.cert-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 60%,#1A3A6A 100%);padding:52px 48px;text-align:center;position:relative;overflow:hidden}
.cert-hero::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.cert-seal{width:80px;height:80px;border-radius:50%;background:rgba(181,144,72,.18);border:2px solid rgba(181,144,72,.45);display:grid;place-items:center;margin:0 auto 22px;position:relative;z-index:1}
.cert-type{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(181,144,72,.85);margin-bottom:14px;position:relative;z-index:1}
.cert-prog{font-size:28px;font-weight:800;letter-spacing:-.028em;color:#fff;margin-bottom:8px;position:relative;z-index:1}
.cert-sub{font-size:15px;color:rgba(255,255,255,.6);position:relative;z-index:1;margin-bottom:5px}
.cert-track{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.32);position:relative;z-index:1}
.cert-body{padding:0}
.cert-row{display:flex;align-items:flex-start;padding:16px 40px;border-bottom:1px solid var(--border)}
.cert-row:last-child{border-bottom:none}
.cert-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);min-width:150px;padding-top:2px}
.cert-value{font-size:15px;font-weight:600;color:var(--ink)}
.cert-hash{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;word-break:break-all}
.confirms{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:28px}
.conf-head{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.conf-list{display:grid;gap:9px}
.conf-item{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.conf-check{color:var(--pass);flex-shrink:0;font-size:13px;margin-top:2px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:13px;font-weight:700;padding:11px 22px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;border:none}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-2)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--ink-2)}.btn-ghost:hover{background:var(--surface-2)}
.not-found{text-align:center;padding:80px 24px}
.nf-icon{font-size:40px;margin-bottom:16px;opacity:.35}
.nf-title{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:8px}
.nf-sub{font-size:14px;color:var(--ink-3);line-height:1.6}
@media print{.rail,.actions,.verify-bar{display:none!important}.wrap{padding:0}.cert{border-radius:0}}
</style>
</head>
<body>
<header class="rail">
  <span class="rail-brand">AGNUS Academy</span>
  <span class="rail-sep"></span>
  <span class="rail-crumb">Credential</span>
  <div class="rail-right">
    <a href="AGNUS - Academy Profile.html" class="rail-btn">← My Profile</a>
    <button class="rail-btn" onclick="window.print()">Print</button>
  </div>
</header>

<div class="wrap" id="main">
  <div class="not-found" id="notFound" style="display:none">
    <div class="nf-icon">🎓</div>
    <div class="nf-title">Credential not found</div>
    <div class="nf-sub">This programme hasn't been completed in this browser yet.<br>Complete the programme to earn your credential.</div>
    <div style="margin-top:24px"><a href="AGNUS - Academy Profile.html" class="btn btn-navy">Go to My Profile</a></div>
  </div>
</div>

<script>
const PROGS = {
  B01:{title:'Finance Agent Deployment',confirms:['Accounts-payable AI agent configured against a defined permission model','Correct approval thresholds set for €0–500, €500–5,000, and €5,000+ tiers','No-PO handling rule correctly enforced — agent holds, never auto-approves','Duplicate detection enabled — no double payments processed','All five test events handled without critical misconfigurations']},
  B02:{title:'HR Agent Deployment',confirms:['GDPR Article 9 special-category data routing correctly configured','Performance data escalation path set without autonomous access','Data minimisation rule applied — agent limited to relevant fields only','GDPR accountability logging enabled for all actions','Leave and query handling configured without discriminatory routing']},
  B03:{title:'Legal Agent Deployment',confirms:['Legal privilege protection correctly configured — no external sharing of privileged content','Routing hierarchy enforced: associate → partner → disputes counsel','Document access scoped to matter type — no cross-matter leakage','External share blocking operational for all high-risk document types','Professional indemnity logging enabled for all agent actions']},
  B04:{title:'Healthcare AI Governance',confirms:['EU AI Act Article 14 human oversight requirement correctly implemented','Emergency override path configured — agent cannot delay emergency alerts','NTS Scorer set to Suggest not Act — no autonomous clinical decisions','Patient routing configured without demographic bias exposure','GDPR Article 9 medical data logging enabled for all interactions']},
  B05:{title:'Customer Service Agent Governance',confirms:['Agent authority correctly scoped to defined return/refund limits','Tone policy enforced — professional response in all customer contexts','14-day statutory withdrawal right correctly routed to human agent','Distressed customer escalation path correctly configured','GDPR data handling and logging enabled for all CS interactions']}
};

function fmt(iso){ return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); }
function hash(code,date){ let h=0; const s=code+date; for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;} return 'AGN-'+Math.abs(h).toString(16).toUpperCase().padStart(8,'0'); }

(function(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code')||'';
  let records = []; try{ records = JSON.parse(localStorage.getItem('agnus_competency_records')||'[]'); }catch(e){}
  const rec = records.find(function(r){ return r.code===code; });
  const prog = PROGS[code];
  if(!rec||!prog){ document.getElementById('notFound').style.display='block'; return; }

  const name = rec.name || localStorage.getItem('agnus_learner_name') || 'AGNUS Academy Learner';
  const dateStr = fmt(rec.date);
  const credId = hash(code, rec.date);

  const main = document.getElementById('main');
  main.innerHTML =
    '<div class="verify-bar"><div class="vb-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M3 8l4 4 6-7"/></svg></div><div><div class="vb-title">Verified competency credential</div><div class="vb-sub">Issued by AGNUS Academy · Stored in this browser · Programme '+code+'</div></div></div>'+
    '<div class="cert">'+
      '<div class="cert-hero">'+
        '<div class="cert-seal"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="rgba(231,214,174,.75)" stroke-width="1.4" stroke-linecap="round"><polygon points="19,3 23.5,14.5 36,14.5 26,22 30,34 19,27 8,34 12,22 2,14.5 14.5,14.5"/></svg></div>'+
        '<div class="cert-type">Certificate of Competency</div>'+
        '<div class="cert-prog">'+prog.title+'</div>'+
        '<div class="cert-sub">Organisational AI Deployment — Configured &amp; Verified</div>'+
        '<div class="cert-track">Track B · AGNUS Academy · '+code+'</div>'+
      '</div>'+
      '<div class="cert-body">'+
        '<div class="cert-row"><span class="cert-label">Awarded to</span><span class="cert-value">'+name+'</span></div>'+
        '<div class="cert-row"><span class="cert-label">Competency</span><span class="cert-value">'+prog.title+' — Configured &amp; Verified</span></div>'+
        '<div class="cert-row"><span class="cert-label">Date issued</span><span class="cert-value">'+dateStr+'</span></div>'+
        '<div class="cert-row"><span class="cert-label">Score</span><span class="cert-value">'+(rec.score||'100%')+'</span></div>'+
        '<div class="cert-row"><span class="cert-label">Issuing body</span><span class="cert-value">AGNUS Academy · AI Governance Professional Programme</span></div>'+
        '<div class="cert-row"><span class="cert-label">Credential ID</span><span class="cert-hash">'+credId+'</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="confirms"><div class="conf-head">What this competency confirms</div><div class="conf-list">'+
    prog.confirms.map(function(c){ return '<div class="conf-item"><span class="conf-check">✓</span><span>'+c+'</span></div>'; }).join('')+
    '</div></div>'+
    '<div class="actions">'+
      '<button class="btn btn-navy" onclick="window.print()">Print credential</button>'+
      '<a href="AGNUS - Academy Profile.html" class="btn btn-ghost">← Back to profile</a>'+
    '</div>';
})();
</script>
</body>
</html>
