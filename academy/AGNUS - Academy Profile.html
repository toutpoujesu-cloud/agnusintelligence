<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AGNUS Academy — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#F8F6F2;--panel:#FFFFFF;--panel-2:#F2F0EB;--line:#E5E2D9;--ink:#18202A;--ink-2:#4A5261;--ink-3:#8E96A2;--navy:#17263C;--navy-2:#0F1A28;--gold:#9A7633;--gold-light:#B59048;--pass:#1A7E4A;--pass-dim:rgba(26,126,74,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,sans-serif;-webkit-font-smoothing:antialiased}
.rail{background:var(--navy-2);height:52px;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100}
.rail-brand{font-weight:800;font-size:14px;color:#fff}
.rail-crumb{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.rail-right{margin-left:auto;display:flex;gap:10px}
.btn{font-family:Manrope,sans-serif;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;border:none;transition:all .15s}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-2)}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8)}.btn-ghost:hover{background:rgba(255,255,255,.08)}
.wrap{max-width:960px;margin:0 auto;padding:48px 24px 100px}
.profile-hero{background:linear-gradient(135deg,var(--navy),#1E3560);border-radius:20px;padding:40px 44px;display:flex;align-items:center;gap:32px;margin-bottom:36px}
.avatar-ring{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:grid;place-items:center;flex-shrink:0;font-size:32px;font-weight:800;color:#fff;letter-spacing:-.02em;font-family:'Newsreader',serif;font-style:italic}
.hero-info{flex:1}
.hero-name{font-size:26px;font-weight:800;letter-spacing:-.026em;color:#fff;margin-bottom:6px}
.hero-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:16px}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:3px}
.stat-n{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--gold-light)}
.stat-l{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.section-head{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px;display:flex;align-items:center;gap:12px}
.section-head::after{content:'';flex:1;height:1px;background:var(--line)}
.competency-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:40px}
.comp-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.comp-card.earned{border-color:#B8D9C8;background:#F6FBF8}
.comp-card.locked{opacity:.55}
.comp-badge{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:6px}
.cb-earned{background:var(--pass-dim);color:var(--pass)}
.cb-locked{background:var(--panel-2);color:var(--ink-3)}
.comp-title{font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--ink);line-height:1.3}
.comp-meta{display:flex;flex-direction:column;gap:4px}
.comp-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3)}
.comp-score{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold)}
.comp-cta{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gold);cursor:pointer;text-decoration:none;margin-top:auto}
.comp-cta:hover{text-decoration:underline}
.track-section{margin-bottom:36px}
.progress-bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-bottom:24px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.activity-list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:40px}
.al-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.al-row:last-child{border-bottom:none}
.al-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.al-dot.earn{background:var(--pass)}
.al-dot.start{background:var(--gold)}
.al-text{flex:1;font-size:13.5px;color:var(--ink-2)}
.al-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3)}
.empty-state{text-align:center;padding:60px 24px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.name-form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;gap:12px;align-items:center;margin-bottom:32px}
.name-form label{font-size:13px;font-weight:600;color:var(--ink);flex-shrink:0}
.name-form input{flex:1;padding:9px 13px;border:1px solid var(--line);border-radius:8px;font-family:Manrope,sans-serif;font-size:13.5px;outline:none}
.name-form input:focus{border-color:var(--gold)}
.name-form .save-btn{font-family:Manrope,sans-serif;font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:8px;background:var(--navy);color:#fff;border:none;cursor:pointer}
</style>
</head>
<body>

<header class="rail">
  <span class="rail-brand">AGNUS Academy</span>
  <span class="rail-crumb">My Profile</span>
  <div class="rail-right">
    <a href="AGNUS - Academy App.html" class="btn btn-ghost">← Dashboard</a>
    <a href="AGNUS - Academy Team Dashboard.html" class="btn btn-ghost">Team view</a>
  </div>
</header>

<div class="wrap">

  <!-- Name setup -->
  <div class="name-form" id="nameForm">
    <label>Your name:</label>
    <input type="text" id="nameInput" placeholder="Enter your name for certificates" />
    <button class="save-btn" onclick="saveName()">Save</button>
  </div>

  <!-- Profile hero -->
  <div class="profile-hero">
    <div class="avatar-ring" id="avatarRing">—</div>
    <div class="hero-info">
      <div class="hero-name" id="heroName">AGNUS Learner</div>
      <div class="hero-sub">AI Governance Professional · Track A & B</div>
      <div class="hero-stats">
        <div class="stat"><span class="stat-n" id="statEarned">0</span><span class="stat-l">Competencies earned</span></div>
        <div class="stat"><span class="stat-n" id="statAvailable">5</span><span class="stat-l">Programmes available</span></div>
        <div class="stat"><span class="stat-n" id="statCompletion">0%</span><span class="stat-l">Track B completion</span></div>
      </div>
    </div>
  </div>

  <!-- Track B competencies -->
  <div class="track-section">
    <div class="section-head">Track B · Organisational Deployment Programmes</div>
    <div class="progress-bar"><div class="progress-fill" id="trackBProgress" style="width:0%"></div></div>
    <div class="competency-grid" id="competencyGrid"></div>
  </div>

  <!-- Recent activity -->
  <div class="section-head">Activity</div>
  <div class="activity-list" id="activityList">
    <div class="empty-state">No activity yet — complete a programme to see records here</div>
  </div>

</div>

<script>
const PROGRAMMES = [
  {code:'B01', title:'Finance Agent Deployment', sub:'Accounts payable · Invoice authority · Approval thresholds', file:'AGNUS - Academy B01 - Finance Agent Deployment.html'},
  {code:'B02', title:'HR Agent Deployment', sub:'GDPR Art. 9 · Special-category data · Performance routing', file:'AGNUS - Academy B02 - HR Agent Deployment.html'},
  {code:'B03', title:'Legal Agent Deployment', sub:'Privilege protection · Routing hierarchy · External share controls', file:'AGNUS - Academy B03 - Legal Agent Deployment.html'},
  {code:'B04', title:'Healthcare AI Governance', sub:'EU AI Act Art. 14 · Emergency override · NTS scoring', file:'AGNUS - Academy B04 - Healthcare AI Governance.html'},
  {code:'B05', title:'Customer Service Agent Governance', sub:'Authority limits · Tone policy · Consumer law · Escalation', file:'AGNUS - Academy B05 - Customer Service Agent Governance.html'}
];

function loadProfile() {
  let name = localStorage.getItem('agnus_learner_name') || '';
  let records = [];
  try { records = JSON.parse(localStorage.getItem('agnus_competency_records') || '[]'); } catch(e){}

  if (name) {
    document.getElementById('nameInput').value = name;
    document.getElementById('heroName').textContent = name;
    document.getElementById('avatarRing').textContent = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('nameForm').style.display = 'none';
  }

  const earned = records.length;
  document.getElementById('statEarned').textContent = earned;
  document.getElementById('statCompletion').textContent = Math.round(earned/5*100) + '%';
  document.getElementById('trackBProgress').style.width = (earned/5*100) + '%';

  // Competency grid
  const grid = document.getElementById('competencyGrid');
  grid.innerHTML = '';
  PROGRAMMES.forEach(function(p) {
    const rec = records.find(function(r){ return r.code === p.code; });
    const card = document.createElement('div');
    card.className = 'comp-card ' + (rec ? 'earned' : 'locked');
    if (rec) {
      const d = new Date(rec.date);
      const dateStr = d.toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'});
      card.innerHTML =
        '<span class="comp-badge cb-earned">✓ Earned</span>' +
        '<div class="comp-title">' + p.title + '</div>' +
        '<div class="comp-meta"><div class="comp-date">' + dateStr + '</div><div class="comp-score">Score: ' + (rec.score||'100%') + '</div></div>' +
        '<a class="comp-cta" href="AGNUS - Academy Credential.html?code=' + p.code + '">View credential →</a>';
    } else {
      card.innerHTML =
        '<span class="comp-badge cb-locked">Not yet earned</span>' +
        '<div class="comp-title">' + p.title + '</div>' +
        '<div style="font-size:12px;color:var(--ink-3);line-height:1.5">' + p.sub + '</div>' +
        '<a class="comp-cta" href="' + p.file + '">Start programme →</a>';
    }
    grid.appendChild(card);
  });

  // Activity
  const list = document.getElementById('activityList');
  if (!records.length) return;
  list.innerHTML = '';
  records.slice().reverse().forEach(function(r) {
    const d = new Date(r.date);
    const dateStr = d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
    const row = document.createElement('div');
    row.className = 'al-row';
    row.innerHTML =
      '<div class="al-dot earn"></div>' +
      '<div class="al-text">Competency earned — <strong>' + r.competency + '</strong></div>' +
      '<div class="al-date">' + dateStr + '</div>';
    list.appendChild(row);
  });
}

window.saveName = function() {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) return;
  localStorage.setItem('agnus_learner_name', val);
  loadProfile();
};

loadProfile();
</script>
</body>
</html>
